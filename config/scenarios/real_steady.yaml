# R1: real service, steady load inside the measured limits.
# Capacity estimate: the draft model (gpt-oss-120b, 8000 TPM) spends ~1,800
# tokens per answer -> ~4.4 answers/min. 3/min is ~70% of that.
name: real_steady
source: real
seed: 11
arrivals:
  - {kind: poisson, rate_per_min: 3, from_s: 0, to_s: 360}
questions: {file: eval/questions.yaml, zipf_s: 1.0}
patience: {median_s: 10, sigma: 0.5, min_s: 3, max_s: 40}
set: ["service.cache=false"]
max_requests: 18
