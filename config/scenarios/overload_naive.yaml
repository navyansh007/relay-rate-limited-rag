# S3 ablation B: same load, no limiter AND naive retries (immediate, up to 5,
# no budget): what a typical client does.
name: overload_naive
source: stand-in
seed: 23
arrivals:
  - {kind: poisson, rate_per_min: 13, from_s: 0, to_s: 360}
questions: {file: eval/questions.yaml, zipf_s: 1.0}
patience: {median_s: 10, sigma: 0.5, min_s: 3, max_s: 40}
set: ["service.cache=false", "limiter.enabled=false", "retry.policy=naive"]
