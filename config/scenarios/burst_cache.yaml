# S2b: the same burst with the answer cache and coalescing ON. Reported as a
# separate row: its hit rate comes from my question-popularity assumption.
name: burst_cache
source: stand-in
seed: 22
arrivals:
  - {kind: poisson, rate_per_min: 2, from_s: 0, to_s: 150}
  - {kind: burst, at_s: 30, n: 100, over_s: 10}
questions: {file: eval/questions.yaml, zipf_s: 1.0}
patience: {median_s: 10, sigma: 0.5, min_s: 3, max_s: 40}
set: ["service.cache=true"]
