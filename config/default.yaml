# All tunables live here so the system can be changed live without code edits.

provider:
  real_base_url: https://api.groq.com/openai/v1
  standin_base_url: http://127.0.0.1:8900/openai/v1
  connect_timeout_s: 3.0
  # Abort a call that has produced no first token in this long (slow-success guard).
  first_token_timeout_s: 8.0
  # Abort if the stream stalls between chunks for this long.
  stall_timeout_s: 5.0

# This free account has no Llama access (404 model_not_found, 2026-11-09);
# GET /models lists gpt-oss-120b, gpt-oss-20b, qwen3.8-27b, allam-2-7b.
models:
  understand: openai/gpt-oss-20b
  draft: openai/gpt-oss-120b
  draft_fallback: openai/gpt-oss-20b
  verify: openai/gpt-oss-20b

# Starting point only; limiter corrects these from response headers.
# Free-tier values are not in the public docs: fill from probes.
limits:
  openai/gpt-oss-120b: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000}
  openai/gpt-oss-20b: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000}
  qwen/qwen3.8-27b: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000}

# USD per 1M tokens (input, output). Used for "cost per 1,000 answers".
# From console.groq.com/docs/models (fetched 2026-11-09).
prices:
  openai/gpt-oss-120b: [0.15, 0.60]
  openai/gpt-oss-20b: [0.075, 0.30]
  qwen/qwen3.8-27b: [0.80, 4.00]

# Safety net so dev work cannot silently burn the shared daily budget.
spend_guard:
  max_real_tokens_per_run: 60000

retrieval:
  setting: s3_rerank
  settings:
    s1_small_many: {piece_tokens: 200, overlap: 40, fetch: 8, rerank: false, candidates: 8}
    s2_big_few:    {piece_tokens: 500, overlap: 80, fetch: 4, rerank: false, candidates: 4}
    s3_rerank:     {piece_tokens: 300, overlap: 60, fetch: 4, rerank: true, candidates: 20}
    s4_tight:      {piece_tokens: 300, overlap: 60, fetch: 3, rerank: true, candidates: 20}
  tool_timeout_s: 3.0
  # Re-ranking is CPU-bound (~0.6-1.1 s per query); cap concurrent re-ranks so a
  # burst queues visibly instead of thrashing the CPU.
  rerank_concurrency: 2

retry:
  policy: budgeted          # budgeted | naive | none
  max_retries: 2
  base_backoff_s: 0.25
  max_backoff_s: 4.0
  retry_budget_ratio: 0.2   # retries may be at most this fraction of first attempts

limiter:
  enabled: true   # false only for the "no client-side limiting" ablation

pipeline:
  understand_mode: model    # model | rules
  understand_min_headroom: 0.2   # below this TPM headroom, route with keyword rules
  max_requery_loops: 1
  # Evidence thresholds for the decide step (PLACEHOLDERS: calibrate on eval set).
  weak_rerank: -4.0         # cross-encoder logit of the best passage
  weak_dense: 0.55          # cosine of the best passage when not re-ranking
  # When the draft model's per-minute headroom drops below this, retrieve fewer pieces.
  tight_headroom: 0.3
  tight_setting: s4_tight
  verify_mode: sentence     # sentence | strict | off
  draft_max_tokens: 400
  understand_max_tokens: 150

# Extra request fields per model. gpt-oss models reason before answering;
# low effort keeps hidden reasoning tokens (TTFT and TPM cost) down.
model_extra:
  openai/gpt-oss-120b: {reasoning_effort: low}
  openai/gpt-oss-20b: {reasoning_effort: low}

service:
  max_concurrent: 16        # pipeline runs at once
  max_queue: 200            # waiting requests beyond this are turned away at once
  cache: true               # answer cache + coalescing of identical in-flight questions
  cache_ttl_s: 600
  # Deadline the *system* plans against (shedding, retry decisions). Real users'
  # patience is unknown to the system and sampled separately by the load generator.
  deadline_s: 15
