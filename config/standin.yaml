# Stand-in model service parameters.
# Latency values below are generic defaults. The per-model values actually used
# are fitted from raw/groq_calls.jsonl by `python -m relay.calibrate`, which
# writes config/standin_calibration.yaml (loaded on top of this file).
# Not measurable on the real service and therefore ASSUMED: `workers`, the load
# slowdown (load_alpha, load_knee) and the fault rates (0 errors in 298 real
# calls bounds the real error rate at about 1% with 95% confidence).

host: 127.0.0.1
port: 8900
seed: 7

# All four limits refill continuously (measured on Groq for RPM, TPM and RPD;
# assumed for TPD, which no header exposes). Values measured 2026-11-09 for
# gpt-oss-20b and gpt-oss-120b on the free tier; TPD is the docs' value.
limits:
  default: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000}
  per_model: {}
  # Groq does NOT reserve max_tokens against TPM (measured: max_tokens 16 vs
  # 2000 both charged ~95 tokens). Charge the prompt at admission, then the
  # completion as it is produced.
  reserve_max_tokens: false

latency:
  # Server-side capacity: requests beyond `workers` queue inside the stand-in.
  workers: 8
  # Time to first token (ms) ~ lognormal(median, sigma) + prefill_ms_per_1k * prompt_tokens/1000
  ttft_median_ms: 250
  ttft_sigma: 0.45
  prefill_ms_per_1k: 40
  # Decode speed (tokens/s) ~ lognormal around median
  decode_tps_median: 400
  decode_tps_sigma: 0.25
  # Load slowdown: multiply TTFT and per-token time by 1 + alpha * max(0, busy/workers - knee)
  load_alpha: 1.5
  load_knee: 0.5
  # Pieces are sent this many tokens at a time (SSE chunk granularity)
  tokens_per_chunk: 4

faults:
  p_server_error: 0.01     # immediate 500/503
  p_hang: 0.005            # accept, then never send a token
  p_slow_success: 0.02     # succeed, but TTFT x slow_factor
  slow_factor: 8.0
  p_midstream_drop: 0.005  # close the stream part-way through

content:
  # Real replies recorded during real runs, keyed by message hash, are replayed
  # verbatim; anything else gets a synthetic reply built from the prompt.
  replay_file: raw/replay.jsonl
  synthetic_out_tokens_median: 120
